<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagrams · Eshara Progress Review</title>
<script>try{const t=localStorage.getItem('eshara-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-part="2">
<div class="deck">
  <nav class="parts" id="parts" aria-label="Parts"></nav>
  <main class="stage" id="stage">

<section class="slide" data-part="2" aria-label="Key diagram: sign to text">
  <div class="wrap">
    <div class="head"><div><p class="eyebrow">Part 2 · Diagrams · the key flow</p><h2>Diagram 4: sign to text, camera recognition</h2></div><p class="hint">Drag to pan, scroll or use + − to zoom</p></div>
    <div class="d4grid">
      <div class="dview" id="dview4" data-src="img/flow/d6.svg">
        <div class="zoombar"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit">⤢</button></div>
      </div>
      <div class="callouts" id="d4callouts"></div>
    </div>
  </div>
</section>

<section class="slide" data-part="2" aria-label="All diagrams">
  <div class="wrap">
    <div class="head"><div><p class="eyebrow">Part 2 · Diagrams</p><h2>User flows across the platform</h2></div>
      <div class="legend-mini"><span>◇ decision</span><span>▭▭ link to another diagram</span><span>- - planned / future</span></div></div>
    <div class="dtabs no-print" id="dtabs" role="group" aria-label="Choose a diagram"></div>
    <div class="dview" id="dviewAll">
      <div class="zoombar"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="fit" aria-label="Fit">⤢</button></div>
    </div>
    <p class="muted" id="dnote" style="font-size:14px"></p>
  </div>
</section>

  </main>
  <nav class="rail" aria-label="Slides">
    <button class="navbtn" id="prev" aria-label="Previous slide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count">1 / 1</span>
    <button class="navbtn" id="theme" aria-label="Switch light or dark theme" title="Light / dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    <button class="navbtn" id="next" aria-label="Next slide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Screen preview">
  <img id="lbImg" alt="">
  <div class="lbbar"><span class="mono muted" id="lbCap"></span><button class="btn" id="lbClose">Close</button></div>
</div>


<script src="js/core.js"></script>
<script src="js/diagrams.js"></script>
</body>
</html>
