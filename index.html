<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eshara Progress Review</title>
<script>try{const t=localStorage.getItem('eshara-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-part="0">
<div class="deck">
  <nav class="parts" id="parts" aria-label="Parts"></nav>
  <main class="stage" id="stage">

<section class="slide" data-part="0" aria-label="Cover">
  <div class="wrap">
    <div class="cover">
      <div style="display:flex;flex-direction:column;gap:22px">
        <p class="eyebrow">Graduation project · progress review · November 2026</p>
        <h1 style="color:var(--teal)">Eshara</h1>
        <p style="font-family:var(--display);font-weight:500;font-size:clamp(20px,2.4vw,30px);line-height:1.25">An Arabic sign language accessibility platform for web and mobile</p>
        <div class="people">
          <div class="person"><span>Supervisor</span><b>Dr. Ahmed Hamza</b></div>
          <div class="person"><span>Teaching assistant</span><b>Eng. Basant Mohamed</b></div>
        </div>
        <div class="agenda no-print" id="agenda"></div>
      </div>
      <div class="handbox">
        <svg id="hand1" viewBox="0 100 580 600" role="img" aria-label="The 21 hand landmarks MediaPipe extracts"></svg>
        <div class="lm-label" id="lmLabel1">Tap a point · 21 landmarks per hand</div>
      </div>
    </div>
  </div>
</section>

  </main>
  <nav class="rail" aria-label="Slides">
    <button class="navbtn" id="prev" aria-label="Previous slide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count">1 / 1</span>
    <button class="navbtn" id="theme" aria-label="Switch light or dark theme" title="Light / dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
    <button class="navbtn" id="next" aria-label="Next slide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>
<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Screen preview">
  <img id="lbImg" alt="">
  <div class="lbbar"><span class="mono muted" id="lbCap"></span><button class="btn" id="lbClose">Close</button></div>
</div>


<script src="js/core.js"></script>
<script src="js/hand.js"></script>
<script src="js/cover.js"></script>
</body>
</html>
